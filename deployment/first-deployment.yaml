apiVersion: v1
kind: Namespace
metadata:
  name: staging
  labels:
    name: staging
    environment: stage
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: first-sa
  namespace: staging
  labels:
    app: first
    app.kubernetes.io/name: first
    app.kubernetes.io/instance: first-stage
    app.kubernetes.io/managed-by: devlift
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: first
  namespace: staging
  annotations:
    reloader.stakater.com/auto: 'true'
  labels:
    app: first
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: first
  template:
    metadata:
      labels:
        app: first
    spec:
      serviceAccountName: first-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 2000
      containers:
        - name: first
          image: 443245368846.dkr.ecr.ap-south-1.amazonaws.com/first:IMAGE_TAG_PLACEHOLDER
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3333
          env:
            - name: K8S_POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: K8S_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: "3"
              memory: "3"
            limits:
              cpu: "3"
              memory: "3"
          livenessProbe:
            httpGet:
              path: /health
              port: 3333
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3333
            initialDelaySeconds: 20
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: first-service
  namespace: staging
  labels:
    app: first
spec:
  type: ClusterIP
  selector:
    app: first
  ports:
  - name: http
    port: 3333
    targetPort: 3333
    protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: first-ingress
  namespace: staging
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    alb.ingress.kubernetes.io/subnets: subnet-placeholder-private-1a,subnet-placeholder-private-1b
    alb.ingress.kubernetes.io/manage-backend-security-group-rules: 'true'
    alb.ingress.kubernetes.io/backend-protocol: HTTP
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/healthcheck-protocol: HTTP
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: '30'
    alb.ingress.kubernetes.io/success-codes: '200'
spec:
  ingressClassName: alb
  rules:
  - host:
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: first-service
            port:
              number: 3333
